    <script>
      (function() {
        try {
          var _fetch = window.fetch;
          var descriptor = {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            }
          };
          Object.defineProperty(window, 'fetch', descriptor);
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (e) {}
          }
        } catch (err) {}
      })();
    </script>
